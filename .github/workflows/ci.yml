name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff check
        run: ruff check server.py queries.py tests/ probe.py

  unit-tests:
    name: Unit tests (no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run unit tests
        run: pytest tests/test_queries.py -v

  integration-tests:
    name: Integration tests (MySQL fixture)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test-root-pw
          MYSQL_DATABASE: studenthub_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest-root-pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pymysql
      - name: Load fixture schema
        env:
          MYSQL_PWD: test-root-pw
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root studenthub_ci < tests/fixtures/schema.sql
      - name: Run integration tests
        env:
          SH_DB_HOST: 127.0.0.1
          SH_DB_PORT: 3306
          SH_DB_USER: root
          SH_DB_PASSWORD: test-root-pw
          SH_DB_NAME: studenthub_ci
        run: pytest tests/test_integration.py -v
