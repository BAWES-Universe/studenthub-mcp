[project]
name = "studenthub-mcp"
version = "0.1.0"
description = "Read-only MCP data layer for StudentHub (BAWES recruitment)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.24.0,<2.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000

[tool.setuptools]
py-modules = ["server", "queries", "probe", "run_integration_local"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that run against a real MySQL fixture DB",
]
testpaths = ["tests"]
